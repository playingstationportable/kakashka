<!DOCTYPE html>
<html>
<body>

<audio id="player" autoplay loop></audio>

<script>

const songs = [
"song1.mp3",
"song2.mp3",
"song3.mp3",
"song4.mp3"
];

let currentSong = Math.floor(Math.random() * songs.length);
const player = document.getElementById("player");

function loadSong(){
    player.src = songs[currentSong];
    player.play();
}

function nextSong(){
    currentSong++;
    if(currentSong >= songs.length){
        currentSong = 0;
    }
    loadSong();
}

function previousSong(){
    currentSong--;
    if(currentSong < 0){
        currentSong = songs.length - 1;
    }
    loadSong();
}

function toggleMute(){
    player.muted = !player.muted;
}

loadSong();

</script>

</body>
</html>
