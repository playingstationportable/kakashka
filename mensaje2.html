<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>26-08-25</title>

<style>
    h2{
        font-size: xx-large;
    }
    p {
        font-size: larger;
    }
    button {
        font-size: x-large;
    }
</style>
</head>

<body>
<iframe src="player.html" style="display:none;" id="musicFrame"></iframe>

<h2>Ruleta de la muerte 👿👿</h2>
<p>Dale al boton y la ruleta va a elegir un reto que tendré que hacer😔, y no hagas trampas dale solo una vez.</p>

<button onclick="spin()">eso es el boton</button>

<p id="result"></p>

<script>

const punishments = [
    "Controlas todas mis acciones durante 5 minutos",
    "Tendré que poner ropa tuya durante un día cuando vengo",
    "Tú eliges mi outfit del día siguiente",
    "Tu eliges el reto",
    "Puedes elegir que pongo en mi bio del ig durante 24 horas",
    "Tengo que hacer dos retos (x2)",
];

const finalMessage = "Enviame una captura del reto para reclamarlo 😗";

let isSpinning = false;

function spin() {

    if(isSpinning) return;

    isSpinning = true;

    const resultText = document.getElementById("result");
    let counter = 0;
    let interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * punishments.length);
        resultText.innerHTML = "⏳ " + punishments[randomIndex];
        counter++;
        if(counter > 15){
            clearInterval(interval);
            const finalIndex = Math.floor(Math.random() * punishments.length);
            resultText.innerHTML =
                "<strong>🥁 La ruleta a elegido que... :</strong><br><br>" +
                punishments[finalIndex] +
                "<br><br>" +
                finalMessage;
            isSpinning = false;
        }
    }, 100);
}

</script>

</body>
</html>
